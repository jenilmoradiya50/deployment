<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch & ATM Work Tracker</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182230;--muted:#65758b;--line:#dce4ee;--blue:#2457d6;--green:#16835d;--red:#bd3c45}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:#14233d;color:white;padding:22px clamp(16px,4vw,42px)}header h1{margin:0;font-size:clamp(22px,3vw,30px)}header p{margin:5px 0 0;color:#cbd6e7}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.tabs{display:flex;background:#e5ebf5;padding:4px;border-radius:12px;gap:4px}.tab{border:0;background:transparent;padding:10px 22px;border-radius:9px;font-weight:700;color:#45556d;cursor:pointer}.tab.active{background:white;color:var(--blue);box-shadow:0 1px 5px #1b31551c}.spacer{flex:1}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:9px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:700}.secondary{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;color:var(--ink)}input,select,textarea{font:inherit;width:100%;padding:10px 11px;border:1px solid #ccd6e3;border-radius:8px;background:white;color:var(--ink)}label{display:block;font-size:13px;font-weight:650;color:#40516a;margin-bottom:5px}.panel,.record,.formbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 18px #243a5807}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px;flex:1}.metric strong{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}.list{display:grid;gap:12px}.recordhead{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}.record h3{margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.pill{display:inline-block;background:#eaf0ff;color:#244cb0;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700}.pill.good{background:#e2f7ec;color:#14714e}.pill.warn{background:#fff1d8;color:#875800}.recorddetails{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px;margin-top:14px}.detail{font-size:13px;color:#40516a;overflow-wrap:anywhere}.detail b{color:#1d2b40}.recordactions{display:flex;gap:8px;margin-top:14px}.formbox{margin-bottom:18px}.formhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.formhead h2{margin:0;font-size:20px}.sectiontitle{font-size:14px;font-weight:800;margin:12px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#eef3fb;color:#344a69;letter-spacing:.04em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field.full{grid-column:1/-1}.inline{display:flex;gap:14px;flex-wrap:wrap;padding:8px 0}.choice{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#182230;background:#fff;border:1px solid #b8c3d2;border-radius:8px;padding:8px 12px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}.choice:has(input:checked){background:#182230;color:#fff;border-color:#182230}.choice input{width:auto;accent-color:#fff}.choice:has(input:checked) input{accent-color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty b{display:block;color:#293a52;font-size:17px;margin-bottom:5px}.search{max-width:290px}.foot{font-size:12px;color:var(--muted);margin:18px 2px}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{margin-top:16px}.panel,.record,.formbox{padding:14px}.tab{padding:10px 15px}}
</style></head><body>
<header><h1>Branch & ATM Work Tracker</h1><p>Track SD-WAN setup, ISP connectivity, configuration, and handover status.</p></header>
<main class="wrap"><div class="toolbar"><div class="tabs" role="tablist"><button class="tab active" data-kind="Branch">Branch</button><button class="tab" data-kind="ATM">ATM</button></div><div class="spacer"></div><input class="search" id="search" placeholder="Search by DP code, ATM ID, IP…" aria-label="Search records"><button class="primary" id="addBtn">＋ Add Branch</button></div>
<div class="summary" id="summary"></div><section id="formHost"></section><section id="records" class="list"></section><p class="foot">Your records are saved in this browser on this laptop. Use Export JSON regularly for a backup, especially before clearing browser data.</p></main>
<script>
const $=s=>document.querySelector(s);let kind='Branch',editing=null,records=load();function load(){try{return JSON.parse(localStorage.getItem('branchAtmTrackerV1')||'[]')}catch{return []}}function persist(){try{localStorage.setItem('branchAtmTrackerV1',JSON.stringify(records));render();return true}catch(err){render();alert('Your record is visible in this session, but the browser could not save it permanently. Please open this file in Chrome or Edge and allow site data/storage. Export a backup before closing.');return false}}
const common=[['vlan','VLAN configured?','choice','Yes|No'],['lanIp','LAN IP','text'],['lanGateway','LAN gateway','text'],['bsnlIp','BSNL IP','text'],['bsnlGateway','BSNL gateway','text'],['bsnlPing','BSNL IP pinging?','choice','Yes|No'],['jioIp','Jio IP','text'],['jioGateway','Jio gateway','text'],['jioPing','Jio IP pinging?','choice','Yes|No'],['airtelIp','Airtel IP','text'],['airtelGateway','Airtel gateway','text'],['ceIp','CE IP','text'],['airtelPing','Airtel / CE IP pinging?','choice','Yes|No'],['configuration','Configuration','choice','Completed|Not completed'],['mp','Device added in MP?','choice','Yes|No'],['online','Device online?','choice','Yes|No'],['mail','Mail sent?','choice','Yes|No'],['dcMail','Mail from DC','choice','Received|Not received'],['drcMail','Mail from DRC','choice','Received|Not received'],['cables','All ISP and LAN cables connected to SD-WAN device?','choice','Connected|Not connected'],['working','Is it working?','choice','Yes|No']];
function fields(){let first=kind==='Branch'?[['dpCode','DP code','text']]:[['atmId','ATM ID','text'],['dpCode','Base branch DP code','text']];let branchLanExtras=kind==='Branch'?[['atmIp','ATM IP','text'],['atmGateway','Second ATM IP','text']]:[];return [...first,...common.slice(0,3),...branchLanExtras,...common.slice(3)]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fieldHtml(f,d){let [id,label,type,opts]=f;let val=d?.[id]??'';if(type==='choice')return `<div class="field"><label>${label}</label><div class="inline">${opts.split('|').map(v=>`<label class="choice"><input type="radio" name="${id}" value="${v}" ${val===v?'checked':''}> ${v}</label>`).join('')}</div></div>`;return `<div class="field"><label for="f_${id}">${label}</label><input id="f_${id}" name="${id}" value="${esc(val)}" placeholder="Enter ${label.toLowerCase()}" ${['lanIp','lanGateway','atmIp','atmGateway','bsnlIp','bsnlGateway','jioIp','jioGateway','airtelIp','airtelGateway','ceIp'].includes(id)?'spellcheck="false"':''}></div>`}
function showForm(id=null){editing=id;let rec=id?records.find(r=>r.id===id):null;let d=rec||{};$('#formHost').innerHTML=`<form class="formbox" id="entryForm"><div class="formhead"><h2>${id?'Edit':'Add'} ${kind} record</h2><button type="button" class="secondary" id="closeForm">✕ Close</button></div><div class="grid">${fields().map(f=>{const sections={lanIp:'LAN',bsnlIp:'BSNL',jioIp:'JIO',airtelIp:'AIRTEL & CE',configuration:'CONFIGURATION & HANDOVER'};const heading=sections[f[0]];return (heading?`<div class="sectiontitle field full">${heading}</div>`:'')+fieldHtml(f,d)}).join('')}</div><div class="actions"><button class="primary" type="submit">${id?'Save changes':'Save '+kind}</button><button class="secondary" type="button" id="cancelForm">Cancel</button></div></form>`;$('#closeForm').onclick=$('#cancelForm').onclick=()=>{$('#formHost').innerHTML='';editing=null};$('#entryForm').addEventListener('submit',function(e){e.preventDefault();try{const data={};for(const field of fields()){const fieldId=field[0];const selected=this.querySelector(`input[name="${fieldId}"]:checked`);const input=this.querySelector(`#f_${fieldId}`);data[fieldId]=selected?selected.value:(input?input.value.trim():'')}if(kind==='Branch'&&!data.dpCode){alert('Please enter the DP code before saving.');const el=this.querySelector('#f_dpCode');if(el)el.focus();return}if(kind==='ATM'&&!data.atmId){alert('Please enter the ATM ID before saving.');const el=this.querySelector('#f_atmId');if(el)el.focus();return}const now=new Date().toISOString();if(editing){records=records.map(r=>r.id===editing?{...r,...data,kind,updated:now}:r)}else{const newId=(window.crypto&&typeof window.crypto.randomUUID==='function')?window.crypto.randomUUID():('rec-'+Date.now()+'-'+Math.random().toString(36).slice(2,10));records.unshift({id:newId,kind,...data,created:now,updated:now})}try{localStorage.setItem('branchAtmTrackerV1',JSON.stringify(records))}catch(storageError){console.error(storageError);alert('The browser blocked permanent saving. Your record will appear for this session, but export a backup before closing this tab.')}$('#formHost').innerHTML='';editing=null;render();$('#records').scrollIntoView({behavior:'smooth',block:'start'})}catch(err){console.error(err);alert('Could not save this record: '+(err.message||err))}});$('#formHost').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){let q=$('#search').value.toLowerCase();let rs=records.filter(r=>r.kind===kind&&JSON.stringify(r).toLowerCase().includes(q));let total=records.filter(r=>r.kind===kind).length,done=records.filter(r=>r.kind===kind&&r.working==='Yes').length;$('#summary').innerHTML=`<div class="metric"><strong>${total}</strong><span>Total ${kind} records</span></div><div class="metric"><strong>${done}</strong><span>Marked working</span></div><div class="metric"><strong>${total-done}</strong><span>Not yet confirmed working</span></div><div class="metric"><strong>${records.length}</strong><span>All saved records</span></div>`;$('#records').innerHTML=rs.length?rs.map(r=>{let title=kind==='Branch'?(r.dpCode||'Branch record'):(r.atmId||'ATM record');let completed=r.working==='Yes';let keys=fields().filter(f=>r[f[0]]);return `<article class="record"><div class="recordhead"><div><h3>${esc(title)}</h3><div class="sub">${kind==='ATM'?'Base branch DP code: '+esc(r.dpCode||'—'):'DP code: '+esc(r.dpCode||'—')} · Updated ${esc(new Date(r.updated||r.created).toLocaleString())}</div></div><span class="pill ${completed?'good':r.working==='No'?'warn':''}">${completed?'Working':r.working==='No'?'Not working':'Status not confirmed'}</span></div><div class="recorddetails">${keys.map(f=>`<div class="detail"><b>${esc(f[1])}:</b> ${esc(r[f[0]]||'—')}</div>`).join('')}</div><div class="recordactions"><button class="secondary" data-edit="${r.id}">Edit record</button><button class="secondary" data-export="${r.id}">Export record</button><button class="secondary" data-delete="${r.id}">Delete</button></div></article>`}).join(''):`<div class="panel empty"><b>No ${kind.toLowerCase()} records yet</b>${q?'No records match your search.':'Click “＋ Add '+kind+'” to enter your first record.'}</div>`;$('#records').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showForm(b.dataset.edit));$('#records').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let r=records.find(x=>x.id===b.dataset.delete);if(confirm('Delete '+(r.dpCode||r.atmId||'this record')+'?')){records=records.filter(x=>x.id!==r.id);persist()}});$('#records').querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>download(records.find(x=>x.id===b.dataset.export),`${kind.toLowerCase()}-record.json`))}
function download(data,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));$('#formHost').innerHTML='';editing=null;$('#addBtn').textContent='＋ Add '+kind;render()});$('#addBtn').onclick=()=>showForm();$('#search').oninput=render;render();
</script></body></html>
